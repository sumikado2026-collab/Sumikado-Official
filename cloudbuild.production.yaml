# Production is never built from source here. This trigger promotes the exact
# image already deployed and reviewed on the staging Cloud Run service.
# Configure a separate, approval-gated Git tag trigger; see DEPLOYMENT.md.
steps:
  - id: verify-staging-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ ! "$TAG_NAME" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo 'A production release requires a prod-vMAJOR.MINOR.PATCH Git tag.' >&2
          exit 1
        fi
        if [[ -z "$COMMIT_SHA" ]]; then
          echo 'The release tag must resolve to a commit.' >&2
          exit 1
        fi

        staged_tag="gcr.io/$PROJECT_ID/official-website:$COMMIT_SHA"
        image_ref="$$(gcloud container images describe "$$staged_tag" --format='value(image_summary.fully_qualified_digest)')"
        if [[ -z "$$image_ref" ]]; then
          echo 'No staging image exists for this commit.' >&2
          exit 1
        fi
        image_digest="$$(gcloud container images describe "$$staged_tag" --format='value(image_summary.digest)')"

        staging_revision="$$(gcloud run services describe official-website --region=asia-east1 --format='value(status.latestReadyRevisionName)')"
        if [[ -z "$$staging_revision" ]]; then
          echo 'The staging service has no ready revision.' >&2
          exit 1
        fi
        staging_digest="$$(gcloud run revisions describe "$$staging_revision" --region=asia-east1 --format='value(status.imageDigest)')"
        if [[ -z "$$staging_digest" || ( "$$staging_digest" != "$$image_ref" && "$$staging_digest" != "$$image_digest" ) ]]; then
          echo 'The release image does not match the latest ready staging revision.' >&2
          exit 1
        fi
        serving_percent="$$(gcloud run services describe official-website --region=asia-east1 --format=json | python3 -c 'import json,sys; service=json.load(sys.stdin); revision=sys.argv[1]; print(sum(item.get("percent", 0) for item in service["status"].get("traffic", []) if item.get("revisionName") == revision))' "$$staging_revision")"
        if [[ "$$serving_percent" != 100 ]]; then
          echo 'The reviewed staging revision must serve 100% of staging traffic.' >&2
          exit 1
        fi

        printf '%s\n' "$$image_ref" > /workspace/production-image.txt
        echo "Promoting the staged image $$image_ref"

  - id: deploy-and-smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        image_ref="$$(cat /workspace/production-image.txt)"
        candidate_tag="r-$SHORT_SHA"

        gcloud run deploy official-website-prod \
          --image="$$image_ref" \
          --region=asia-east1 \
          --platform=managed \
          --service-account="official-website-prod-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
          --allow-unauthenticated \
          --no-traffic \
          --tag="$$candidate_tag"

        candidate_url="$$(gcloud run services describe official-website-prod --region=asia-east1 --format=json | python3 -c 'import json,sys; print(next(item["url"] for item in json.load(sys.stdin)["status"]["traffic"] if item.get("tag") == sys.argv[1]))' "$$candidate_tag")"
        python3 - "$$candidate_url" <<'PY'
        import sys
        import urllib.request

        base = sys.argv[1].rstrip('/')
        for path in ('/', '/science.html'):
            with urllib.request.urlopen(base + path, timeout=30) as response:
                if response.status != 200:
                    raise SystemExit(f'{path}: HTTP {response.status}')
                print(f'{path}: HTTP {response.status}')
        PY

        gcloud run services update-traffic official-website-prod \
          --region=asia-east1 \
          --to-tags="$$candidate_tag=100"

options:
  logging: CLOUD_LOGGING_ONLY
