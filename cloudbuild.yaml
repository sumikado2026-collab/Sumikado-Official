steps:
  # The main-branch trigger uses this file to update the existing website.
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/official-website:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/official-website:$COMMIT_SHA']

  # Deploy the container image to the existing Cloud Run website service.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'official-website' # existing website service
      - '--image'
      - 'gcr.io/$PROJECT_ID/official-website:$COMMIT_SHA'
      - '--region'
      - 'asia-east1' # Change to your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/official-website:$COMMIT_SHA'
